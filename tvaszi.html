<body>

  <h1 style="text-align: center; font-size: 100px; color: #DBE4EE">Tavaszi szünet visszaszámláló</h1>
  <p id="demo"></p>

  <script>
    var countDownDate = new Date("marc 25, 2027 00:00:00").getTime();

    var x = setInterval(function () {

      var now = new Date().getTime();

      var distance = countDownDate - now;

      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("demo").innerHTML = days + "nap " + hours + "óra "
        + minutes + "perc " + seconds + "másodperc ";

      if (distance < 0) {
        clearInterval(x);
        document.getElementById("demo").innerHTML = "Itt a szünet.";
      }
    }, 1000);

        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }
    </script>
