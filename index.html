
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iskolai szünetek</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background:
        linear-gradient(rgba(0,80,100,0.35),
                        rgba(0,50,80,0.55)),
        url("nyar.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
}

nav {
    background: rgba(0,91,125,0.85);
    backdrop-filter: blur(12px);
    padding: 15px 30px;
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.menu-icon {
    font-size: 35px;
    cursor: pointer;
}

.sidenav {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 10;
    top: 0;
    right: 0;
    background: linear-gradient(#0077b6,#00b4d8);
    overflow-x: hidden;
    transition: 0.4s;
    padding-top: 70px;
}

.sidenav a {
    display: block;
    padding: 15px 25px;
    color: white;
    text-decoration: none;
    font-size: 20px;
    transition: 0.3s;
}

.sidenav a:hover {
    background: rgba(255,255,255,0.2);
    color: #ffd166;
}

.sidenav .closebtn {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 40px;
}

main {
    text-align: center;
    padding: 65px 20px;
}

h1 {
    font-size: clamp(38px, 7vw, 75px);
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    margin-bottom: 15px;
}

.subtitle {
    font-size: 22px;
    margin-bottom: 45px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
    max-width: 1050px;
    margin: auto;
}

.card {
    display: block;
    text-decoration: none;
    color: white;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 25px;
    padding: 35px 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    background: rgba(255,255,255,0.35);
}

.card span {
    font-size: 55px;
    display: block;
    margin-bottom: 15px;
}

.card h2 {
    font-size: 23px;
}

@media(max-width: 700px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 450px) {
    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn"
           onclick="closeNav()">×</a>

        <a href="index.html">🏠 Főoldal</a>
        <a href="nyari.html">☀️ Nyári szünet</a>
        <a href="oszi.html">🍂 Őszi szünet</a>
        <a href="teli.html">❄️ Téli szünet</a>
        <a href="tvaszi.html">🌸 Tavaszi szünet</a>
        <a href="13last.html">🎓 13. évfolyam</a>
    </div>
<nav>
    <div class="nav-container">
        <img src="countdown_logo.png" alt="Logo" class="logo">
        <span class="menu-icon" onclick="openNav()">☰</span>
    </div>

    
</nav>

<main>

    <h1>Üdvözlünk! ☀️</h1>

    <p class="subtitle">
        Iskolai szünetek visszaszámlálói
        <br>
        Válaszd ki, melyik szünetre vársz! 🌴
    </p>

    <div class="cards">

        <a href="nyari.html" class="card">
            <span>☀️</span>
            <h2>Nyári szünet</h2>
        </a>

        <a href="oszi.html" class="card">
            <span>🍂</span>
            <h2>Őszi szünet</h2>
        </a>

        <a href="teli.html" class="card">
            <span>❄️</span>
            <h2>Téli szünet</h2>
        </a>

        <a href="tvaszi.html" class="card">
            <span>🌸</span>
            <h2>Tavaszi szünet</h2>
        </a>

        <a href="13last.html" class="card">
            <span>🎓</span>
            <h2>13. évfolyam</h2>
        </a>

    </div>

</main>

<script>
function openNav() {
    document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
    document.getElementById("mySidenav").style.width = "0";
}
</script>

</body>
</html>
