
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Őszi szünet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background:
        linear-gradient(
            135deg,
            rgba(130, 65, 20, 0.45),
            rgba(220, 140, 40, 0.4)
        ),
        url("osz.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: white;
}

nav {
    background: rgba(120, 65, 25, 0.85);
    backdrop-filter: blur(12px);
    padding: 15px 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.menu-icon {
    font-size: 35px;
    cursor: pointer;
    color: white;
    transition: 0.3s;
}

.menu-icon:hover {
    color: #ffd166;
    transform: scale(1.1);
}

.sidenav {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 10;
    top: 0;
    right: 0;
    background: linear-gradient(180deg, #a45116, #e99b36);
    overflow-x: hidden;
    transition: 0.4s;
    padding-top: 70px;
    box-shadow: -5px 0 25px rgba(0,0,0,0.2);
}

.sidenav a {
    padding: 15px 25px;
    text-decoration: none;
    font-size: 20px;
    color: white;
    display: block;
    transition: 0.3s;
}

.sidenav a:hover {
    background: rgba(255,255,255,0.2);
    color: #ffe082;
    padding-left: 35px;
}

.sidenav .closebtn {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 40px;
}

#osz {
    min-height: 75vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    text-align: center;
}

.badge {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 30px;
    padding: 12px 25px;
    font-size: 16px;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(35px, 7vw, 75px);
    font-weight: 800;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    margin-bottom: 15px;
}

h2 {
    font-size: clamp(20px, 4vw, 35px);
    font-weight: 500;
    color: #fff0d0;
    margin-bottom: 35px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    width: min(800px, 100%);
}

.time-box {
    background: rgba(120, 65, 25, 0.55);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 25px;
    padding: 25px 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.time-box:hover {
    transform: translateY(-8px);
    background: rgba(160, 90, 30, 0.7);
}

.time-box span {
    display: block;
    font-size: clamp(30px, 5vw, 60px);
    font-weight: bold;
    color: #ffd166;
}

.time-box small {
    font-size: 15px;
    color: white;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.footer-text {
    margin-top: 35px;
    font-size: 18px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

@media (max-width: 600px) {
    nav {
        padding: 12px 20px;
    }

    .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .time-box {
        padding: 20px 10px;
        border-radius: 18px;
    }

    .footer-text {
        font-size: 15px;
    }
}
</style>
</head>

<body>
<div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn"
           onclick="closeNav()">×</a>

        <a href="index.html">🏠 Főoldal</a>
        <a href="nyari.html">☀️ Nyári szünet</a>
        <a href="teli.html">❄️ Téli szünet</a>
        <a href="tvaszi.html">🌸 Tavaszi szünet</a>
        <a href="13last.html">🎓 13. évfolyam</a>
    </div>
<nav>
    <div class="nav-container">
        <img src="countdown_logo.png" alt="Logo" class="logo">
        <span class="menu-icon" onclick="openNav()">☰</span>
    </div>

    
</nav>

<div id="osz">

    <div class="badge">
        🍂 ŐSZI SZÜNET VISSZASZÁMLÁLÓ 🍂
    </div>

    <h1>Őszi szünet</h1>

    <h2>
        Már csak ennyi van hátra az őszi szünetig! 🍁
    </h2>

    <div class="countdown">

        <div class="time-box">
            <span id="days">0</span>
            <small>Nap</small>
        </div>

        <div class="time-box">
            <span id="hours">0</span>
            <small>Óra</small>
        </div>

        <div class="time-box">
            <span id="minutes">0</span>
            <small>Perc</small>
        </div>

        <div class="time-box">
            <span id="seconds">0</span>
            <small>Másodperc</small>
        </div>

    </div>

    <p class="footer-text">
        🍁 Színes falevelek, forró tea és pihenés! ☕
    </p>

</div>

<script>
var countDownDate =
    new Date("October 23, 2027 00:00:00").getTime();

var x = setInterval(function () {

    var now = new Date().getTime();
    var distance = countDownDate - now;

    if (distance <= 0) {
        clearInterval(x);

        document.getElementById("osz").innerHTML =
            "<h1>🍂 Itt az őszi szünet! 🍁</h1>";

        return;
    }

    var days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
    );

    var hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
    );

    var minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
    );

    var seconds = Math.floor(
        (distance % (1000 * 60)) / 1000
    );

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;

}, 1000);

function openNav() {
    document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
    document.getElementById("mySidenav").style.width = "0";
}
</script>

</body>
</html>
